<nav
  class="navbar navbar-expand-lg fixed-top"
  [ngClass]="{'navbar-transparent': !isDashboard, 'navbar-dark bg-dark': isDashboard}"
>
  <div class="container">
    <div class="navbar-translate">
      <a class="navbar-brand" href="#home">
        <i class="nc-icon nc-chart-bar-32"></i> Market Climb
      </a>

      <!-- Hamburger toggle for small screens -->
      <button *ngIf="!hideSidebarToggle" class="navbar-toggler" type="button" (click)="sidebarToggle()" aria-label="Toggle navigation" title="Toggle navigation">
        <span class="navbar-toggler-bar bar1" aria-hidden="true"></span>
        <span class="navbar-toggler-bar bar2" aria-hidden="true"></span>
        <span class="navbar-toggler-bar bar3" aria-hidden="true"></span>
        <span class="sr-only">Toggle navigation</span>
      </button>
    </div>

    <div class="collapse navbar-collapse justify-content-end" [ngClass]="{'show': sidebarVisible}">
      <ul class="navbar-nav">

        <!-- Navigation Links -->
        <li class="nav-item" [class.active]="activeSection === 'home'">
          <a class="nav-link" href="#home">Home</a>
        </li>
        <li class="nav-item" [class.active]="activeSection === 'features'">
          <a class="nav-link" href="#features">Features</a>
        </li>
        <li class="nav-item" [class.active]="activeSection === 'about'">
          <a class="nav-link" href="#about">About</a>
        </li>

        <!-- Dynamic Buttons -->
        <li *ngIf="!isLoggedIn" class="nav-item">
          <a class="btn btn-round btn-primary" routerLink="/register">Join Now</a>
        </li>
        <li *ngIf="isLoggedIn" class="nav-item">
          <a class="nav-link" routerLink="/profile">Profile</a>
        </li>
        <li *ngIf="isLoggedIn" class="nav-item">
          <a class="nav-link" routerLink="/funding">Funding</a>
        </li>

      </ul>
    </div>
  </div>
</nav>
