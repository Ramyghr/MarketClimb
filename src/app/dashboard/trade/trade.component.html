<div class="trade-container">

  <!-- Market Info Bar -->
  <div class="market-info-bar">
    <div class="symbol-info">
      <h2 class="symbol-name">{{ selectedSymbol }}</h2>
      <span class="symbol-exchange">Live Trading</span>
    </div>
    <div class="price-info">
      <span class="current-price">${{ currentPrice | number:'1.2-2' }}</span>
      <span class="price-change" [ngClass]="{'positive': priceChange >= 0, 'negative': priceChange < 0}">
        <i [class]="priceChange >= 0 ? 'fas fa-arrow-up' : 'fas fa-arrow-down'"></i>
        {{ priceChange | number:'1.2-2' }} ({{ priceChangePercent | number:'1.2-2' }}%)
      </span>
    </div>
    <div class="market-stats">
      <div class="stat-item">
        <span class="stat-label">High</span>
        <span class="stat-value">${{ high | number:'1.2-2' }}</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Low</span>
        <span class="stat-value">${{ low | number:'1.2-2' }}</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Volume</span>
        <span class="stat-value">{{ volume | number:'1.0-0' }}</span>
      </div>
    </div>
  </div>

  <!-- Main Section: Chart + Watchlist -->
  <div class="main-section">
    <div class="chart-column">
      <div class="chart-wrapper">
        <app-tradingview-widget
          [symbol]="selectedSymbol"
          [width]="1100"
          [height]="500"
          [theme]="'dark'">
        </app-tradingview-widget>
      </div>
    </div>

    <div class="right-column">
      <app-watchlist></app-watchlist>
    </div>
  </div>

  <!-- Trading Panels Grid -->
  <div class="trading-panels">
    <!-- Left Column: Order Panel -->
    <div class="panel-column left-column">
      <app-order-panel></app-order-panel>
    </div>

    <!-- Right Column: Order Book + Recent Trades -->
    <div class="panel-column right-column">
      <div class="stacked-panels">
        <div class="panel-card">
          <app-order-book [symbol]="selectedSymbol"></app-order-book>
        </div>
        <div class="panel-card">
          <app-recent-trades [symbol]="selectedSymbol"></app-recent-trades>
        </div>
      </div>
    </div>
  </div>

</div>
