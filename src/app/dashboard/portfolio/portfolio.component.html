<!-- portfolio.component.html -->
<div class="portfolio">
  <h2>My Portfolio</h2>
  <table>
    <thead>
      <tr>
        <th>Symbol</th>
        <th>Name</th>
        <th>Qty</th>
        <th>Price</th>
        <th>24h</th>
        <th>Value</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let asset of assets" (click)="selectAsset(asset)">
        <td>{{ asset.symbol }}</td>
        <td>{{ asset.name }}</td>
        <td>{{ asset.quantity }}</td>
        <td>{{ asset.price | number:'1.2-2' }}</td>
        <td [ngClass]="{pos: asset.change24h>0, neg: asset.change24h<0}">{{ asset.change24h }}%</td>
        <td>{{ (asset.price * asset.quantity) | number:'1.2-2' }}</td>
      </tr>
    </tbody>
  </table>
  <h3>Total Portfolio Value: {{ totalValue | number:'1.2-2' }} USD</h3>
</div>
