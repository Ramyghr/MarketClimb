<div class="news-overlay" *ngIf="isVisible" (click)="hide()">
  <div class="news-panel" (click)="$event.stopPropagation()">
    
    <!-- Header -->
    <div class="news-header">
      <div class="header-left">
        <h2 class="news-title">
          <i class="fas fa-newspaper"></i>
          Market News
        </h2>
        <span class="live-indicator">
          <span class="pulse-dot"></span>
          Live Updates
        </span>
      </div>
      <button class="close-btn" title="close" (click)="hide()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Search & Filters -->
    <div class="news-controls">
      <div class="search-bar">
        <i class="fas fa-search search-icon"></i>
        <input 
          type="text" 
          [(ngModel)]="searchQuery"
          (input)="onSearchChange()"
          placeholder="Search news, symbols..."
          class="search-input">
      </div>

      <div class="filter-tabs">
        <button 
          class="filter-tab" 
          [class.active]="activeFilter === 'all'"
          (click)="setFilter('all')">
          All News
        </button>
        <button 
          class="filter-tab" 
          [class.active]="activeFilter === 'trending'"
          (click)="setFilter('trending')">
          <i class="fas fa-fire"></i> Trending
        </button>
        <button 
          class="filter-tab" 
          [class.active]="activeFilter === 'bookmarked'"
          (click)="setFilter('bookmarked')">
          <i class="fas fa-bookmark"></i> Saved
        </button>
      </div>
    </div>

    <!-- Category Pills -->
    <div class="category-pills">
      <button 
        *ngFor="let cat of categories"
        class="category-pill"
        [class.active]="selectedCategory === cat"
        (click)="setCategory(cat)">
        {{ cat | titlecase }}
      </button>
    </div>

    <!-- News Feed -->
    <div class="news-feed">
      <div *ngIf="filteredArticles.length === 0" class="no-results">
        <i class="fas fa-inbox"></i>
        <p>No articles found</p>
      </div>

      <div 
        *ngFor="let article of filteredArticles" 
        class="news-card"
        (click)="openArticle(article)">
        
        <!-- Article Image (if exists) -->
        <div *ngIf="article.imageUrl" class="article-image">
          <img [src]="article.imageUrl" title="artile" [alt]="article.title">
          <div class="sentiment-badge" [ngClass]="getSentimentClass(article.sentiment)">
            {{ getSentimentIcon(article.sentiment) }}
          </div>
        </div>

        <!-- Article Content -->
        <div class="article-content">
          <div class="article-header">
            <div class="source-info">
              <span class="source-icon">{{ article.sourceIcon }}</span>
              <span class="source-name">{{ article.source }}</span>
              <span class="article-time">{{ getTimeAgo(article.timestamp) }}</span>
            </div>
            <button 
              class="bookmark-btn" 
              [class.bookmarked]="article.isBookmarked"
              title="bookmark"
              (click)="$event.stopPropagation(); toggleBookmark(article)">
              <i [class]="article.isBookmarked ? 'fas fa-bookmark' : 'far fa-bookmark'"></i>
            </button>
          </div>

          <h3 class="article-title">{{ article.title }}</h3>
          <p class="article-summary">{{ article.summary }}</p>

          <!-- Related Symbols -->
          <div class="article-footer">
            <div class="related-symbols">
              <span 
                *ngFor="let symbol of article.relatedSymbols" 
                class="symbol-tag"
                (click)="$event.stopPropagation(); onSymbolClick(symbol)">
                {{ symbol }}
              </span>
            </div>
            <div class="article-meta">
              <span class="views">
                <i class="fas fa-eye"></i> {{ article.views | number:'1.0-0' }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
