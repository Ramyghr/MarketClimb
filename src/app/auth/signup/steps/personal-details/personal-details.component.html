<!-- personal-details.component.html -->
<div class="text-center mb-3">
  <div class="avatar-preview">
    <img [src]="profilePreview" alt="Profile" class="avatar-img">
  </div>
  <input type="file" id="profileInput" (change)="onFileSelected($event)" hidden>
  <button type="button" class="btn btn-outline-primary btn-sm mt-2" (click)="triggerFileInput()">Upload Profile Picture</button>
</div>

<form [formGroup]="personalForm" >
  <div class="row">
    <div class="col-md-6">
      <input type="text" class="form-control" formControlName="first_name" placeholder="First Name">
    </div>
    <div class="col-md-6">
      <input type="text" class="form-control" formControlName="last_name" placeholder="Last Name">
    </div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <input type="email" class="form-control" formControlName="email" placeholder="Email">
    </div>
    <div class="col-md-6">
      <select class="form-control" title="gender" formControlName="gender">
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <input type="date" class="form-control" formControlName="date_of_birth" placeholder="Date of Birth">
    </div>
  </div>
</form>
