<div class="text-center mb-3">
  <div class="avatar-preview">
    <img
      [src]="profilePreview || '/assets/img/default-avatar.png'"
      alt="Profile"
      class="avatar-img"
    >
  </div>
  <input type="file" id="profileInput" (change)="onFileSelected($event)" hidden>
  <button type="button" class="btn btn-outline-primary btn-sm mt-2" (click)="triggerFileInput()">
    Upload Profile Picture
  </button>
</div>

<form [formGroup]="personalForm">

  <div class="row">
    <div class="col-md-6">
      <div class="form-group" [ngClass]="{'has-danger': personalForm.get('firstName')?.invalid && personalForm.get('firstName')?.touched}">
        <input type="text" class="form-control" formControlName="firstName" placeholder="First Name">
        <div class="form-control-feedback" *ngIf="personalForm.get('firstName')?.invalid && personalForm.get('firstName')?.touched">
          First Name is required
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="form-group" [ngClass]="{'has-danger': personalForm.get('lastName')?.invalid && personalForm.get('lastName')?.touched}">
        <input type="text" class="form-control" formControlName="lastName" placeholder="Last Name">
        <div class="form-control-feedback" *ngIf="personalForm.get('lastName')?.invalid && personalForm.get('lastName')?.touched">
          Last Name is required
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <div class="form-group" [ngClass]="{'has-danger': personalForm.get('email')?.invalid && personalForm.get('email')?.touched}">
        <input type="email" class="form-control" formControlName="email" placeholder="Email">
        <div class="form-control-feedback" *ngIf="personalForm.get('email')?.invalid && personalForm.get('email')?.touched">
          <div *ngIf="personalForm.get('email')?.errors?.['required']">Email is required</div>
          <div *ngIf="personalForm.get('email')?.errors?.['email']">Enter a valid email</div>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="form-group">
        <select class="form-control" formControlName="gender" title="sexe">
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
        <div class="form-control-feedback" *ngIf="personalForm.get('gender')?.invalid && personalForm.get('gender')?.touched">
          Gender is required
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <div class="form-group" [ngClass]="{'has-danger': personalForm.get('dateOfBirth')?.invalid && personalForm.get('dateOfBirth')?.touched}">
        <input type="date" class="form-control" formControlName="dateOfBirth" placeholder="Date of Birth">
        <div class="form-control-feedback" *ngIf="personalForm.get('dateOfBirth')?.invalid && personalForm.get('dateOfBirth')?.touched">
          Date of Birth is required
        </div>
      </div>
    </div>
  </div>

  

</form>
