  <app-header ></app-header>
<div class="signup-page">

  <div class="page-header" style="background-image: url('/assets/img/login-image.jpg');">
    <div class="filter"></div>
    <div class="container">
      <div class="row justify-content-center">

        <!-- Sidebar (Left Column) -->
        <div class="col-lg-3 col-md-4">
          <div class="sidebar-steps p-3">
            <ul class="steps-list">
              <li *ngFor="let s of steps" 
                  [class.active]="step === s.number" 
                  [class.completed]="isStepCompleted(s.number)">
                <span class="step-number">{{ s.number }}</span>
                <span class="step-label">{{ s.name }}</span>
              </li>
            </ul>
          </div>
        </div>

        <!-- Form Card (Right Column) -->
        <div class="col-lg-6 col-md-8">
          <div class="card card-login p-4">

            <h3 class="title text-center mb-4">Create Your Account</h3>

            <!-- Error Message -->
            <div *ngIf="errorMessage" class="alert alert-danger">
              <i class="fas fa-exclamation-circle"></i>
              {{ errorMessage }}
              <button type="button" class="btn-close" (click)="errorMessage = ''">×</button>
            </div>

            <!-- Step Components -->
            <!-- Change (stepCompleted) to (next) -->
            <app-personal-details 
              *ngIf="step === 1" 
              (next)="nextStep($event, 1)">
            </app-personal-details>

            <app-further-info 
              *ngIf="step === 2" 
              (next)="nextStep($event, 2)"
              (previous)="previousStep()">
            </app-further-info>

            <app-account-config 
              *ngIf="step === 3" 
              (next)="nextStep($event, 3)"
              (previous)="previousStep()">
            </app-account-config>

            <app-declaration 
              *ngIf="step === 4" 
              (next)="nextStep($event, 4)"
              (previous)="previousStep()">
            </app-declaration>

            <!-- Step 5: Start Trading / Final Step -->
            <div *ngIf="step === 5" class="final-step text-center">
              <i class="fas fa-rocket" style="font-size: 4rem; color: #00c896; margin-bottom: 1.5rem;"></i>
              <h2 style="color: #00c896; font-family: 'Orbitron', sans-serif; margin-bottom: 1rem;">You're All Set!</h2>
              <p style="color: #9ca3af; font-size: 1.1rem; margin-bottom: 2rem;">
                Ready to start your trading journey with MarketClimb?
              </p>

              <div class="d-flex justify-content-center gap-3">
                <button 
                  class="btn btn-secondary" 
                  (click)="previousStep()"
                  [disabled]="loading">
                  <i class="fas fa-arrow-left"></i> Back
                </button>
                <button 
                  class="btn btn-primary btn-lg" 
                  (click)="finishSignup()"
                  [disabled]="loading">
                  <span *ngIf="!loading">
                    <i class="fas fa-check-circle"></i> Complete Registration
                  </span>
                  <span *ngIf="loading">
                    <i class="fas fa-spinner fa-spin"></i> Creating Account...
                  </span>
                </button>
              </div>
            </div>

            <!-- Navigation Buttons (Hidden on final step) -->
            <div *ngIf="step < 5" class="d-flex justify-content-between mt-3">
              <button 
                class="btn btn-secondary" 
                (click)="previousStep()" 
                [disabled]="step === 1">
                <i class="fas fa-arrow-left"></i> Previous
              </button>
              <button 
                class="btn btn-primary" 
                (click)="nextStep(null, step)">
                Next <i class="fas fa-arrow-right"></i>
              </button>
            </div>

            <!-- Sign In Link -->
            <div class="text-center mt-3">
              Already have an account? <a routerLink="/signin">Sign In</a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

</div>
