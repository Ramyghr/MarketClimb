<div class="wrapper">
  <div class="page-header" style="background-image: url('/assets/img/login-image.jpg');">
    <div class="filter"></div>
    <div class="container">
      <div class="row">
        <div class="col-lg-4 col-sm-6 mr-auto ml-auto">
          <div class="card card-login">

            <!-- Success Message -->
            <div *ngIf="emailSent" class="text-center">
              <div class="success-icon mb-3">
                <i class="nc-icon nc-check-2"></i>
              </div>
              <h3 class="title">Check Your Email</h3>
              <p class="text-muted mb-4">
                {{ successMessage }}
              </p>
              <button class="btn btn-danger btn-block btn-round" (click)="goToLogin()">
                Back to Sign In
              </button>
            </div>

            <!-- Form -->
            <div *ngIf="!emailSent">
              <h3 class="title text-center">Forgot Password?</h3>
              <p class="text-muted text-center mb-4">
                Enter your email address and we'll send you instructions to reset your password.
              </p>

              <!-- Error message -->
              <div *ngIf="errorMessage" class="text-danger text-center mb-3">
                {{ errorMessage }}
              </div>

              <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
                <div class="input-group form-group-no-border" 
                     [ngClass]="{'input-group-focus': email?.touched}">
                  <div class="input-group-prepend">
                    <span class="input-group-text">
                      <i class="nc-icon nc-email-85"></i>
                    </span>
                  </div>
                  <input type="email" 
                         class="form-control" 
                         placeholder="Email" 
                         formControlName="email"
                         [disabled]="isLoading">
                </div>

                <div *ngIf="hasError('email', 'required') || hasError('email', 'email')" 
                     class="text-danger mb-3 text-center">
                  Please enter a valid email address
                </div>

                <button class="btn btn-danger btn-block btn-round" 
                        type="submit" 
                        [disabled]="isLoading">
                  <span *ngIf="!isLoading">Send Reset Link</span>
                  <span *ngIf="isLoading">
                    <i class="fa fa-spinner fa-spin"></i> Sending...
                  </span>
                </button>
              </form>

              <div class="back-to-login text-center mt-3">
                <a routerLink="/signin">
                  <i class="nc-icon nc-minimal-left"></i> Back to Sign In
                </a>
              </div>
            </div>

          </div>
        </div>
      </div>

      <footer class="footer register-footer text-center mt-3">
        &copy; {{ currentYear }}. MarketClimb <i class="fa fa-heart heart"></i>
      </footer>
    </div>
  </div>
</div>
